<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投組比較</title>
  <link rel="icon" href="./icon.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <h1><img src="./icon.webp" alt="">投組比較</h1>
      <p class="meta"><a href="./fire.html">FIRE</a> · <span id="updated"></span></p>
    </header>
    <section class="layout">
      <aside>
        <input id="filter" type="search" placeholder="代號或名稱" autocomplete="off">
        <div class="controls">
          <div class="window" id="window" role="group" aria-label="區間">
            <button type="button" data-years="0" class="is-on" aria-pressed="true">全部</button>
            <button type="button" data-years="5" aria-pressed="false">5 年</button>
            <button type="button" data-years="10" aria-pressed="false">10 年</button>
            <button type="button" data-years="custom" aria-pressed="false">自訂</button>
          </div>
          <div class="dates" hidden>
            <input id="from" type="month">
            <input id="to" type="month">
          </div>
          <label class="amount">再平衡
            <select id="rebalance">
              <option value="year">每年</option>
              <option value="quarter">每季</option>
              <option value="month">每月</option>
              <option value="none">不調整</option>
            </select>
          </label>
          <div class="amount-row">
            <label class="mode"><input id="dca" type="checkbox"> 定期定額</label>
            <label class="amount">每月 <input id="amount" type="number" min="1" step="1000" value="10000"></label>
          </div>
          <div class="amount-row">
            <label class="mode"><input id="bench-dca" type="checkbox"> 基準定額</label>
            <label class="amount">金額 <input id="bench-amount" type="number" min="1" step="1000" value="10000"></label>
          </div>
          <p id="weight-error" class="error" hidden>勾選的比例加總不能超過 100</p>
          <button id="add" type="button">加入這組</button>
          <button id="save" type="button" hidden>儲存這組</button>
        </div>
        <div id="picker"></div>
      </aside>
      <div>
        <p id="note"></p>
        <div class="window chart-mode" id="chart-mode" role="group" aria-label="圖表">
          <button type="button" data-mode="value" class="is-on" aria-pressed="true">市值</button>
          <button type="button" data-mode="drawdown" aria-pressed="false">回撤</button>
          <button type="button" data-mode="rolling" aria-pressed="false">5 年滾動</button>
        </div>
        <div id="legend"></div>
        <div class="chart-wrap">
          <canvas id="chart" width="840" height="390"></canvas>
          <div id="hover" hidden></div>
        </div>
        <table>
          <thead>
            <tr>
              <th>組合</th>
              <th>期間</th>
              <th>年化</th>
              <th>波動</th>
              <th>最大回撤</th>
              <th>期末</th>
            </tr>
          </thead>
          <tbody id="stats"></tbody>
        </table>
        <div class="table-wrap">
          <table>
            <thead><tr id="year-head"><th>年度</th></tr></thead>
            <tbody id="years"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
