<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投組比較</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <h1>投組比較</h1>
      <p class="meta" id="updated"></p>
    </header>
    <section class="layout">
      <aside>
        <input id="filter" type="search" placeholder="代號或名稱" autocomplete="off">
        <div id="picker"></div>
        <label class="mode"><input id="dca" type="checkbox"> 定期定額，每月 1 萬</label>
        <button id="add" type="button">加入這組</button>
      </aside>
      <div>
        <p id="note"></p>
        <div id="legend"></div>
        <div class="chart-wrap">
          <canvas id="chart" width="720" height="280"></canvas>
          <div id="hover" hidden></div>
        </div>
        <table>
          <thead>
            <tr>
              <th>組合</th>
              <th>期間</th>
              <th>年化</th>
              <th>波動</th>
              <th>最大回撤</th>
              <th>期末</th>
            </tr>
          </thead>
          <tbody id="stats"></tbody>
        </table>
        <table>
          <thead><tr id="year-head"><th>年度</th></tr></thead>
          <tbody id="years"></tbody>
        </table>
        <p class="fine">各組用自己的重疊月份，起點都是 1 萬。不滿 12 個月的年度標了 *。台幣與美元沒有換成同一種貨幣。含息還原價，未扣稅和手續費。過去績效不代表未來。</p>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
