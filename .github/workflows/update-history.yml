name: update history

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install
        run: pip install -r requirements.txt

      - name: test
        run: python -m pytest -q

      - name: refresh monthly history
        run: python scripts/update_history.py

      - name: rebuild site data
        run: python scripts/build_site_data.py

      - name: commit refreshed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.parquet data/meta.json web/history.json
          if git diff --cached --quiet; then
            echo "history unchanged"
            exit 0
          fi
          git commit -s -m "chore(data): refresh monthly history"
          git push
